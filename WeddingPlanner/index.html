<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chad &amp; Eric | Wedding Planner</title>
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>

<div class="nav-overlay" id="navOverlay"></div>
<nav class="nav-drawer" id="navDrawer">
  <div class="brand">Chad <span style="color:var(--accent)">&amp;</span> Eric</div>
  <div id="navItems"></div>
</nav>

<header class="topbar">
  <button class="icon-btn" id="hamburgerBtn" aria-label="Open menu">
    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
  </button>
  <div class="brand">Chad <span class="amp">&amp;</span> Eric</div>
  <div class="spacer"></div>
  <button class="icon-btn" id="themeToggle" aria-label="Toggle dark mode">
    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round"><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg>
  </button>
</header>

<main>
  <div class="tab-panel active" id="panel-overview"></div>
  <div class="tab-panel" id="panel-budget"></div>
  <div class="tab-panel" id="panel-guests"></div>
  <div class="tab-panel" id="panel-party"></div>
  <div class="tab-panel" id="panel-vendors"></div>
  <div class="tab-panel" id="panel-timeline"></div>
  <div class="tab-panel" id="panel-venue"></div>
  <div class="tab-panel" id="panel-moodboard"></div>
  <div class="tab-panel" id="panel-invites"></div>
</main>

<script src="./js/data-guests.js"></script>
<script src="./js/data-budget.js"></script>
<script src="./js/data.js"></script>
<script src="./js/store.js"></script>
<script src="./js/icons.js"></script>
<script src="./js/links.js"></script>
<script src="./js/render-overview.js"></script>
<script src="./js/render-budget.js"></script>
<script src="./js/render-guests.js"></script>
<script src="./js/render-party.js"></script>
<script src="./js/render-vendors.js"></script>
<script src="./js/render-timeline.js"></script>
<script src="./js/render-venue.js"></script>
<script src="./js/render-moodboard.js"></script>
<script src="./js/render-invites.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
